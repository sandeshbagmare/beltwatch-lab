[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "beltwatch-lab"
version = "0.2.0"
description = "CPU video world-model experiment for synthetic conveyor faults"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.1,<3",
    "pillow>=12,<14",
    "safetensors>=0.5,<1",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "ty>=0.0.1,<1"]

[project.scripts]
beltwatch = "beltwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
