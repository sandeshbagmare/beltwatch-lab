name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install CPU dependencies and package
        run: |
          python -m pip install --upgrade "setuptools>=84.1"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test]"
      - run: python -m ruff check src tests browser_tests
      - run: python -m ruff format --check src tests browser_tests
      - run: ty check src
      - run: python -m pytest --cov=beltwatch --cov-report=term-missing
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Check the interactive demo
        if: runner.os == 'Linux'
        run: python -m pytest browser_tests -q
